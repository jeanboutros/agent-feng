[project]
name = "agent-feng"
version = "0.1.0"
description = "AI application built with pydantic-ai and MCP servers"
readme = "README.md"
authors = [
    { name = "Jean Boutros", email = "jean.boutros@bauermediaoutdoor.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "async-lru>=2.1.0",
    "httpx[http2]>=0.28.1",
    "mcp>=1.25.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]



[dependency-groups]
# Slim: truly minimal
slim = [
    "pydantic-ai-slim[openai]",
]

api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

# Development
dev = ["pydantic-ai", "pytest>=9.0.0", "pytest-asyncio>=1.3.0"]

[project.scripts]
agent-feng = "agent_feng:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

