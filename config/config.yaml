# Agent Feng Configuration
# This file contains application configuration settings.
# Secrets should NOT be stored here - use .env or a secrets provider.

application:
  name: "Agent Feng"
  version: "0.1.0"

# MCP Server configuration
mcp:
  servers: []
  # Example:
  # - name: "example-server"
  #   url: "http://localhost:8080"

# AI Provider configuration
ai:
  provider: "openai"  # or "anthropic", "ollama", etc.
  # Model-specific settings are loaded from environment variables

# FastAPI configuration (when enabled)
api:
  enabled: false
  host: "0.0.0.0"
  port: 8000

agents:
  - name: "feng_news_grabber"
    role: "An AI agent that grabs news from the web."
    instructions_file: "config/instructions/agent-feng-instructions.txt"
    guidance_file: "config/guidance/feng_news_grabber_guidance.md"
    model_type: "ollama"
    model_name: "qwen2.5:14b"
    provider_config:
      base_url: "http://localhost:11434/v1"
    tools:
      - name: "web_search"
        type: "serpapi"
      - name: "code_executor"
        type: "python"